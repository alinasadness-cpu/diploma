services:
  mysql:
    image: mysql:8.0
    container_name: mysql-diploma
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=app
      - MYSQL_USER=app
      - MYSQL_PASSWORD=pass
    command: --innodb-buffer-pool-size=64M --max-connections=50

  postgres:
    image: postgres:15
    container_name: postgres-diploma
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=pass
    command: -c shared_buffers=64MB -c max_connections=50

  gate-simulator:
    image: node:18-alpine
    container_name: gate-simulator
    working_dir: /app
    volumes:
      - ./gate-simulator:/app
    ports:
      - "9999:9999"
    command: sh -c "npm install && npm start"